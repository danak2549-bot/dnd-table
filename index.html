<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стол приключений</title>
<link rel="stylesheet" href="sheet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<section id="login" class="login">
  <h1>Стол приключений</h1>
  <div id="auth-box" class="stack">
    <p class="dim">Войдите в аккаунт: ваши игры и персонажи сохраняются, пока вы снова не зайдёте.</p>
    <input id="a-user" class="sheet-input" placeholder="Имя аккаунта" autocomplete="username" maxlength="24">
    <input id="a-pass" class="sheet-input" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <button id="a-login" class="sheet-btn" type="button">Войти</button>
    <button id="a-register" class="sheet-btn alt" type="button">Создать аккаунт</button>
  </div>
  <div id="lobby" class="stack" hidden>
    <p class="dim">Аккаунт: <b id="lobby-user"></b> <button id="a-logout" class="sheet-btn alt small" type="button">Выйти</button></p>
    <h3 class="sheet-h">Мои игры</h3>
    <div id="my-games" class="stack"></div>
    <h3 class="sheet-h">Новая игра</h3>
    <button id="l-create" class="sheet-btn" type="button">Создать комнату (я мастер)</button>
    <h3 class="sheet-h">Войти по коду</h3>
    <input id="l-code" class="sheet-input" placeholder="Код комнаты" maxlength="8">
    <input id="l-name" class="sheet-input" placeholder="Имя героя (для новой игры)" maxlength="40">
    <button id="l-join" class="sheet-btn alt" type="button">Войти игроком</button>
    <details class="manual"><summary>У меня старая комната с ключом мастера</summary>
      <input id="l-key" class="sheet-input" placeholder="Ключ мастера">
      <button id="l-master" class="sheet-btn alt" type="button">Привязать комнату к аккаунту (код выше)</button>
    </details>
  </div>
  <div id="l-err" class="err" role="alert"></div>
</section>

<main id="game" hidden>
  <header class="top">
    <div><button id="menu" class="sheet-btn alt small" type="button" aria-label="В меню">☰</button> <strong id="room-code"></strong> <span id="role" class="dim"></span></div>
    <div id="loc" class="loc"></div>
  </header>
  <div id="qbanner" class="qbanner" hidden></div>
  <div class="mapwrap">
    <canvas id="map"></canvas>
    <div class="zoom">
      <button id="z-in" type="button" aria-label="Приблизить">+</button>
      <button id="z-out" type="button" aria-label="Отдалить">−</button>
      <button id="z-focus" type="button" aria-label="К выбранному токену">◎</button>
      <button id="z-reset" type="button" aria-label="Вся карта">⤢</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="sheet" class="on" type="button">Лист</button>
    <button data-tab="quests" type="button">Задания</button>
    <button data-tab="inv" type="button">Вещи</button>
    <button data-tab="log" type="button">События</button>
    <button data-tab="master" type="button" id="tab-master" hidden>Мастер</button>
  </nav>
  <section id="p-sheet" class="panel">
    <div id="avatar" class="avatar" hidden><div class="av-svg"></div><ul class="av-list"></ul></div>
    <div id="profile" class="profile" hidden>
      <input id="pr-race" class="sheet-input" placeholder="Раса" maxlength="40" list="races">
      <datalist id="races"></datalist>
      <input id="pr-class" class="sheet-input" placeholder="Класс" maxlength="40">
      <input id="pr-level" class="sheet-input sheet-num" type="number" min="1" max="30" placeholder="Ур.">
    </div>
    <div id="sheet"></div>
  </section>
  <section id="p-quests" class="panel" hidden><div id="quests"></div></section>
  <section id="p-inv" class="panel" hidden><div id="inv"></div></section>
  <section id="p-log" class="panel" hidden>
    <div class="dice">
      <input id="dice-expr" class="sheet-input" value="1d20" maxlength="12" aria-label="Кубы">
      <button id="dice-go" class="sheet-btn" type="button">Бросить</button>
    </div>
    <div id="log" class="log"></div>
  </section>
  <section id="p-master" class="panel" hidden>
    <div class="keybox">Комната привязана к вашему аккаунту. Код для игроков: <code id="mkey"></code></div>
    <h3 class="sheet-h">Герои</h3>
    <div id="heroes" class="stack"></div>
    <div id="chat" class="chat"></div>
    <div id="proposal" class="proposal" hidden>
      <div id="prop-list"></div>
      <button id="apply" class="sheet-btn" type="button">Применить для всех</button>
      <button id="discard" class="sheet-btn alt" type="button">Отклонить</button>
    </div>
    <textarea id="ai-text" class="sheet-input" rows="2" placeholder="Например: придумай засаду гоблинов в лесу"></textarea>
    <button id="ai-send" class="sheet-btn" type="button">Спросить ИИ</button>
    <details class="manual">
      <summary>Вручную</summary>
      <div class="row"><input id="m-name" class="sheet-input" placeholder="Имя врага/НПС"><input id="m-hp" class="sheet-input sheet-num" type="number" value="10"></div>
      <div class="row"><button id="m-enemy" class="sheet-btn" type="button">+ Враг</button><button id="m-npc" class="sheet-btn alt" type="button">+ НПС</button></div>
      <input id="m-locname" class="sheet-input" placeholder="Название локации">
      <textarea id="m-locdesc" class="sheet-input" rows="2" placeholder="Описание локации"></textarea>
      <button id="m-loc" class="sheet-btn" type="button">Показать игрокам</button>
      <div class="row"><input id="m-w" class="sheet-input sheet-num" type="number" placeholder="Шир."><input id="m-h" class="sheet-input sheet-num" type="number" placeholder="Выс."></div>
      <input id="m-bg" class="sheet-input" placeholder="Ссылка на картинку карты (https://…)">
      <button id="m-leave" class="sheet-btn alt" type="button">Покинуть локацию (на карту мира)</button>
      <button id="m-world" class="sheet-btn alt" type="button">Карта мира (40×28)</button>
      <button id="m-map" class="sheet-btn" type="button">Обновить карту</button>
      <button id="m-del" class="sheet-btn alt" type="button">Удалить выбранный токен</button>
      <button id="m-hide" class="sheet-btn alt" type="button">Скрыть/показать выбранный</button>
    </details>
  </section>
</main>
<div id="dialog" class="dialog" hidden>
  <div class="dlg-card">
    <div class="dlg-head"><strong id="dlg-name"></strong> <span id="dlg-sub" class="dim"></span></div>
    <div id="dlg-text" class="dlg-text"></div>
    <div id="dlg-quest" class="q-card" hidden></div>
    <div id="dlg-say" class="row" hidden><input id="dlg-say-in" class="sheet-input" placeholder="Что скажет НПС" maxlength="200"><button id="dlg-say-go" class="sheet-btn" type="button">Сказать</button></div>
    <div class="row"><button id="dlg-take" class="sheet-btn" type="button" hidden>Принять задание</button><button id="dlg-close" class="sheet-btn alt" type="button">Закрыть</button></div>
  </div>
</div>
<div id="shop-modal" class="shop-modal" hidden>
  <section class="shop-panel" role="dialog" aria-modal="true" aria-label="Магазин">
    <header class="shop-header">
      <div><h2 class="shop-title">Магазин</h2><div class="shop-sub"></div><div class="shop-gold"></div></div>
      <button class="sheet-btn alt small shop-close" type="button">Закрыть</button>
    </header>
    <div class="shop-toolbar">
      <input class="sheet-input shop-search" placeholder="Поиск по ассортименту">
      <button class="sheet-btn alt small" type="button" data-filter="all">Все</button>
      <button class="sheet-btn alt small" type="button" data-filter="weapon">Оружие</button>
      <button class="sheet-btn alt small" type="button" data-filter="armor">Броня и снаряжение</button>
      <button class="sheet-btn alt small" type="button" data-filter="book">Книги</button>
    </div>
    <div class="shop-status" role="status"></div>
    <div class="shop-body"></div>
</section>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
